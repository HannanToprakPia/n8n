name: Reference Document Generation

on:
  workflow_dispatch:
    inputs:
      component_name:
        description: Component full name
        required: true
        type: string

      repository_owner:
        description: Source repository owner
        required: true
        type: string

      repository_name:
        description: Source repository name
        required: true
        type: string

      source_branch:
        description: Source repository branch
        required: true
        default: develop
        type: string

jobs:
  generate-reference-sds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout component repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository_owner }}/${{ inputs.repository_name }}
          ref: ${{ inputs.source_branch }}
          token: ${{ secrets.COMPONENT_REPO_TOKEN }}
          path: component-source
          fetch-depth: 1

      - name: Verify checkout
        shell: bash
        run: |
          set -euo pipefail

          test -d component-source/.git

          echo "Component: ${{ inputs.component_name }}"
          echo "Repository: ${{ inputs.repository_owner }}/${{ inputs.repository_name }}"
          echo "Branch: ${{ inputs.source_branch }}"
          echo "Commit SHA: $(git -C component-source rev-parse HEAD)"

      - name: Check registered commands
        shell: bash
        working-directory: component-source
        run: |
          set -euo pipefail

          echo "Searching for generate-re-sds and scan-source command definitions..."
          echo

          echo "Matching files:"
          find . \
            -type f \
            \( \
              -iname '*generate-re-sds*' \
              -o -iname '*scan-source*' \
            \) \
            -print \
            | sort \
            || true

          echo
          echo "Command-related files:"
          find . \
            -type f \
            \( \
              -path '*/commands/*' \
              -o -path '*/.opencode/command/*' \
              -o -path '*/.opencode/commands/*' \
            \) \
            -print \
            | sort \
            || true

          echo
          echo "OpenCode configuration files:"
          find . \
            -maxdepth 4 \
            -type f \
            \( \
              -iname 'opencode.json' \
              -o -iname 'opencode.jsonc' \
              -o -path '*/.opencode/*' \
            \) \
            -print \
            | sort \
            || true

      - name: Install OpenCode
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://opencode.ai/install | bash

          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

          "$HOME/.opencode/bin/opencode" --version

      - name: Scan component source
        shell: bash
        working-directory: component-source
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail

          mkdir -p re-output/sds

          opencode run \
            "/scan-source --path . --output re-output/sds"

      - name: Verify source scan output
        shell: bash
        working-directory: component-source
        run: |
          set -euo pipefail

          SOURCE_SCAN="re-output/sds/source-scan.md"

          if [ ! -s "$SOURCE_SCAN" ]; then
            echo "Source scan output was not generated:"
            echo "$SOURCE_SCAN"

            echo
            echo "Current re-output files:"
            find re-output -type f -print | sort || true

            exit 1
          fi

          echo "Source scan generated successfully:"
          echo "$SOURCE_SCAN"
          echo "Character count: $(wc -c < "$SOURCE_SCAN")"

      - name: Generate Reference SDS
        shell: bash
        working-directory: component-source
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail

          opencode run "/generate-re-sds"

      - name: Verify SDS output
        shell: bash
        working-directory: component-source
        run: |
          set -euo pipefail

          SDS_DIR="re-output/sds"
          SDS_MAIN_FILE="$SDS_DIR/README.md"

          if [ ! -d "$SDS_DIR" ]; then
            echo "SDS output directory was not generated:"
            echo "$SDS_DIR"
            exit 1
          fi

          if [ ! -s "$SDS_MAIN_FILE" ]; then
            echo "Main SDS document was not generated:"
            echo "$SDS_MAIN_FILE"

            echo
            echo "Files currently available under re-output:"
            find re-output -type f -print | sort || true

            exit 1
          fi

          REQUIRED_FILES=(
            "$SDS_DIR/README.md"
            "$SDS_DIR/source-scan.md"
            "$SDS_DIR/architecture.md"
            "$SDS_DIR/api-endpoints.md"
            "$SDS_DIR/file-inventory.md"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$file" ]; then
              echo "Required SDS output is missing or empty:"
              echo "$file"
              exit 1
            fi
          done

          echo "Reference SDS generated successfully."
          echo
          echo "Generated SDS files:"

          find "$SDS_DIR" \
            -maxdepth 1 \
            -type f \
            -name '*.md' \
            -print \
            | sort

          echo
          echo "Main document character count:"
          wc -c < "$SDS_MAIN_FILE"

          echo
          echo "First 20 lines of README.md:"
          head -20 "$SDS_MAIN_FILE"

      - name: Inspect generated files
        shell: bash
        working-directory: component-source
        run: |
          set -euo pipefail

          echo "Generated files under re-output:"

          find re-output \
            -type f \
            -print \
            | sort

      - name: Upload SDS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reference-sds-${{ inputs.component_name }}
          path: component-source/re-output/sds/**
          if-no-files-found: error
          retention-days: 7
