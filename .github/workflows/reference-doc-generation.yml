name: Cognia RE SDS Generation

on:
  workflow_dispatch:
    inputs:
      component_name:
        description: Component full name
        required: true
        type: string

      repository_owner:
        description: Source repository owner
        required: true
        type: string

      repository_name:
        description: Source repository name
        required: true
        type: string

      source_branch:
        description: Source repository branch
        required: true
        default: develop
        type: string

jobs:
  generate-reference-sds:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      OLLAMA_MODEL: gemma4:31b
      COMPONENT_PATH: workspace/component-source
      SDS_OUTPUT_PATH: workspace/sds-output

    steps:
      # ---------------------------------------------------------
      # 1. Checkout component repository
      # ---------------------------------------------------------
      - name: Checkout component repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository_owner }}/${{ inputs.repository_name }}
          ref: ${{ inputs.source_branch }}
          token: ${{ secrets.COMPONENT_REPO_TOKEN }}
          path: workspace/component-source
          fetch-depth: 1

      - name: Verify component checkout
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$COMPONENT_PATH/.git" ]; then
            echo "Component repository checkout failed."
            exit 1
          fi

          echo "Component: ${{ inputs.component_name }}"
          echo "Repository: ${{ inputs.repository_owner }}/${{ inputs.repository_name }}"
          echo "Branch: ${{ inputs.source_branch }}"
          echo "Commit SHA: $(git -C "$COMPONENT_PATH" rev-parse HEAD)"

      # ---------------------------------------------------------
      # 2. Prepare workspace
      # ---------------------------------------------------------
      - name: Prepare SDS workspace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$SDS_OUTPUT_PATH"

          echo "Workspace:"
          find workspace -maxdepth 2 -type d -print | sort

      # ---------------------------------------------------------
      # 3. Test Ollama Cloud authentication and model access
      # ---------------------------------------------------------
      - name: Test Ollama Cloud
        shell: bash
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${OLLAMA_API_KEY:-}" ]; then
            echo "OLLAMA_API_KEY secret is missing."
            exit 1
          fi

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --output /tmp/ollama-response.json \
              --write-out "%{http_code}" \
              "https://ollama.com/api/chat" \
              -H "Authorization: Bearer $OLLAMA_API_KEY" \
              -H "Content-Type: application/json" \
              --data "{
                \"model\": \"$OLLAMA_MODEL\",
                \"messages\": [
                  {
                    \"role\": \"user\",
                    \"content\": \"Reply only with OK\"
                  }
                ],
                \"stream\": false
              }"
          )"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Ollama Cloud test failed with HTTP $HTTP_CODE."
            cat /tmp/ollama-response.json || true
            exit 1
          fi

          echo "Ollama Cloud authentication succeeded."
          echo "Model: $OLLAMA_MODEL"

      # ---------------------------------------------------------
      # 4. Install OpenCode
      # ---------------------------------------------------------
      - name: Install OpenCode
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://opencode.ai/install | bash

          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

          "$HOME/.opencode/bin/opencode" --version

      # ---------------------------------------------------------
      # 5. Configure OpenCode for Ollama Cloud
      # ---------------------------------------------------------
      - name: Configure OpenCode for Ollama Cloud
        shell: bash
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/opencode"

          cat > "$HOME/.config/opencode/opencode.json" <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "ollama-cloud/gemma4:31b",
            "provider": {
              "ollama-cloud": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "Ollama Cloud",
                "options": {
                  "baseURL": "https://ollama.com/v1",
                  "apiKey": "{env:OLLAMA_API_KEY}",
                  "headers": {
                    "Authorization": "Bearer {env:OLLAMA_API_KEY}"
                  }
                },
                "models": {
                  "gemma4:31b": {
                    "name": "Gemma 4 31B",
                    "limit": {
                      "context": 131072,
                      "output": 32768
                    }
                  }
                }
              }
            }
          }
          EOF

          echo "OpenCode provider configuration created."
          echo "Selected model: ollama-cloud/$OLLAMA_MODEL"

          # API key'i loglamadan config yapısını kontrol et.
          python -m json.tool \
            "$HOME/.config/opencode/opencode.json" \
            > /dev/null

      # ---------------------------------------------------------
      # 6. SDS-RE source scan
      # ---------------------------------------------------------
      - name: SDS-RE scan source
        shell: bash
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail

          opencode run \
            "/scan-source --path $COMPONENT_PATH --output $SDS_OUTPUT_PATH" \
            --agent sds-re-lead-agent \
            --model "ollama-cloud/$OLLAMA_MODEL"

      # ---------------------------------------------------------
      # 7. Generate Reference SDS
      # ---------------------------------------------------------
      - name: Generate Reference SDS
        shell: bash
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail

          opencode run \
            "/generate-re-sds --interactive=false" \
            --agent sds-re-lead-agent \
            --model "ollama-cloud/$OLLAMA_MODEL"

      # ---------------------------------------------------------
      # 8. Inspect output
      # ---------------------------------------------------------
      - name: Inspect SDS output
        shell: bash
        run: |
          set -euo pipefail

          echo "Files generated under $SDS_OUTPUT_PATH:"

          find "$SDS_OUTPUT_PATH" \
            -type f \
            -print \
            | sort \
            || true

      # ---------------------------------------------------------
      # 9. Validate SDS output
      # ---------------------------------------------------------
      - name: Verify SDS output
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$SDS_OUTPUT_PATH" ]; then
            echo "SDS output directory does not exist:"
            echo "$SDS_OUTPUT_PATH"
            exit 1
          fi

          MARKDOWN_COUNT="$(
            find "$SDS_OUTPUT_PATH" \
              -type f \
              -name '*.md' \
              | wc -l \
              | tr -d ' '
          )"

          if [ "$MARKDOWN_COUNT" -eq 0 ]; then
            echo "No Markdown SDS document was generated."

            echo
            echo "Available files:"
            find "$SDS_OUTPUT_PATH" \
              -type f \
              -print \
              | sort \
              || true

            exit 1
          fi

          echo "SDS generation completed successfully."
          echo "Markdown file count: $MARKDOWN_COUNT"

          echo
          echo "Generated Markdown documents:"

          find "$SDS_OUTPUT_PATH" \
            -type f \
            -name '*.md' \
            -print \
            | sort

          echo
          echo "Document sizes:"

          find "$SDS_OUTPUT_PATH" \
            -type f \
            -name '*.md' \
            -exec wc -c {} \; \
            | sort -n

      # ---------------------------------------------------------
      # 10. Upload output as GitHub Actions artifact
      # ---------------------------------------------------------
      - name: Upload SDS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reference-sds-${{ inputs.component_name }}
          path: workspace/sds-output/**
          if-no-files-found: error
          retention-days: 7
