name: Reference Document Generation

on:
  workflow_dispatch:
    inputs:
      component_name:
        description: Component full name
        required: true
        type: string

      repository_owner:
        description: Source repository owner
        required: true
        type: string

      repository_name:
        description: Source repository name
        required: true
        type: string

      source_branch:
        description: Source repository branch
        required: true
        default: develop
        type: string

jobs:
  generate-reference-sds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout component repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository_owner }}/${{ inputs.repository_name }}
          ref: ${{ inputs.source_branch }}
          token: ${{ secrets.COMPONENT_REPO_TOKEN }}
          path: component-source
          fetch-depth: 1

      - name: Verify checkout
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "component-source/.git" ]; then
            echo "Component repository checkout failed."
            exit 1
          fi

          echo "Component: ${{ inputs.component_name }}"
          echo "Repository: ${{ inputs.repository_owner }}/${{ inputs.repository_name }}"
          echo "Branch: ${{ inputs.source_branch }}"
          echo "Commit SHA: $(git -C component-source rev-parse HEAD)"

      - name: Check command definitions
        shell: bash
        working-directory: component-source
        run: |
          set -euo pipefail

          echo "Searching for Cognia/OpenCode command definitions..."
          echo

          find . \
            -type f \
            \( \
              -iname '*scan-source*' \
              -o -iname '*generate-re-sds*' \
              -o -path '*/commands/*' \
              -o -path '*/.opencode/command/*' \
              -o -path '*/.opencode/commands/*' \
              -o -iname 'opencode.json' \
              -o -iname 'opencode.jsonc' \
            \) \
            -print \
            | sort \
            || true

      - name: Install OpenCode
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://opencode.ai/install | bash

          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

          "$HOME/.opencode/bin/opencode" --version

      - name: Scan component source
        shell: bash
        working-directory: component-source
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail

          mkdir -p re-output/sds

          opencode run \
            "/scan-source --path . --output re-output/sds"

      - name: Verify source scan output
        shell: bash
        working-directory: component-source
        run: |
          set -euo pipefail

          SCAN_DIR="re-output/sds"

          if [ ! -d "$SCAN_DIR" ]; then
            echo "Source scan directory was not generated:"
            echo "$SCAN_DIR"
            exit 1
          fi

          echo "Files generated by source scan:"
          find "$SCAN_DIR" -maxdepth 1 -type f -print | sort

          SOURCE_SCAN="$SCAN_DIR/source-scan.md"
          SCAN_SUMMARY="$SCAN_DIR/scan-summary.md"
          SCAN_RESULT="$SCAN_DIR/scan-result.json"

          SOURCE_SCAN_FOUND=false

          if [ -s "$SOURCE_SCAN" ]; then
            echo "Found source scan document:"
            echo "$SOURCE_SCAN"
            SOURCE_SCAN_FOUND=true
          fi

          if [ -s "$SCAN_SUMMARY" ]; then
            echo "Found scan summary:"
            echo "$SCAN_SUMMARY"
            SOURCE_SCAN_FOUND=true
          fi

          if [ -s "$SCAN_RESULT" ]; then
            echo "Found scan result:"
            echo "$SCAN_RESULT"
            SOURCE_SCAN_FOUND=true
          fi

          if [ "$SOURCE_SCAN_FOUND" != "true" ]; then
            echo
            echo "No supported source scan output was generated."
            echo "Expected at least one of:"
            echo "- $SOURCE_SCAN"
            echo "- $SCAN_SUMMARY"
            echo "- $SCAN_RESULT"

            echo
            echo "Current re-output files:"
            find re-output -type f -print | sort || true

            exit 1
          fi

          echo
          echo "Source scan validation passed."

      - name: Generate Reference SDS
        shell: bash
        working-directory: component-source
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail

          opencode run "/generate-re-sds"

      - name: Verify SDS output
        shell: bash
        working-directory: component-source
        run: |
          set -euo pipefail

          SDS_DIR="re-output/sds"

          if [ ! -d "$SDS_DIR" ]; then
            echo "SDS output directory was not generated:"
            echo "$SDS_DIR"
            exit 1
          fi

          echo "Files available under SDS output directory:"
          find "$SDS_DIR" -maxdepth 1 -type f -print | sort

          SDS_FOUND=false

          POSSIBLE_MAIN_FILES=(
            "$SDS_DIR/sds.md"
            "$SDS_DIR/README.md"
            "$SDS_DIR/architecture.md"
            "$SDS_DIR/api-endpoints.md"
          )

          for file in "${POSSIBLE_MAIN_FILES[@]}"; do
            if [ -s "$file" ]; then
              echo "Found SDS output:"
              echo "$file"
              SDS_FOUND=true
            fi
          done

          MARKDOWN_COUNT="$(
            find "$SDS_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.md' \
              | wc -l \
              | tr -d ' '
          )"

          echo "Markdown file count: $MARKDOWN_COUNT"

          if [ "$SDS_FOUND" != "true" ] && [ "$MARKDOWN_COUNT" -eq 0 ]; then
            echo
            echo "No SDS markdown output was generated."

            echo
            echo "Current re-output files:"
            find re-output -type f -print | sort || true

            exit 1
          fi

          echo
          echo "Reference SDS validation passed."

      - name: Inspect generated files
        shell: bash
        working-directory: component-source
        run: |
          set -euo pipefail

          echo "All generated files under re-output:"
          find re-output -type f -print | sort

          echo
          echo "Generated file sizes:"
          find re-output \
            -type f \
            -exec wc -c {} \; \
            | sort -n

      - name: Upload SDS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reference-sds-${{ inputs.component_name }}
          path: component-source/re-output/sds/**
          if-no-files-found: error
          retention-days: 7
