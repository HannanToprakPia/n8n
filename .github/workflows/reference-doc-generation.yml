name: Cognia RE SDS Generation

on:
  workflow_dispatch:
    inputs:
      component_name:
        description: Component full name
        required: true
        type: string

      repository_owner:
        description: Source repository owner
        required: true
        type: string

      repository_name:
        description: Source repository name
        required: true
        type: string

      source_branch:
        description: Source repository branch
        required: true
        default: develop
        type: string

jobs:
  generate-reference-sds:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      OLLAMA_MODEL: gemma4:31b
      COMPONENT_PATH: workspace/component-source
      SDS_OUTPUT_PATH: workspace/sds-output

    steps:
      # ---------------------------------------------------------
      # 1. Checkout component repository
      # ---------------------------------------------------------
      - name: Checkout component repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository_owner }}/${{ inputs.repository_name }}
          ref: ${{ inputs.source_branch }}
          token: ${{ secrets.COMPONENT_REPO_TOKEN }}
          path: workspace/component-source
          fetch-depth: 1

      # ---------------------------------------------------------
      # 2. Verify checkout
      # ---------------------------------------------------------
      - name: Verify component checkout
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$COMPONENT_PATH/.git" ]; then
            echo "Component repository checkout failed."
            echo "Expected repository path: $COMPONENT_PATH"
            exit 1
          fi

          echo "Component: ${{ inputs.component_name }}"
          echo "Repository: ${{ inputs.repository_owner }}/${{ inputs.repository_name }}"
          echo "Branch: ${{ inputs.source_branch }}"
          echo "Commit SHA: $(git -C "$COMPONENT_PATH" rev-parse HEAD)"

          echo
          echo "Repository root files:"
          find "$COMPONENT_PATH" \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

      # ---------------------------------------------------------
      # 3. Prepare output workspace
      # ---------------------------------------------------------
      - name: Prepare SDS workspace
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$SDS_OUTPUT_PATH"

          echo "Workspace directories:"
          find workspace \
            -maxdepth 2 \
            -type d \
            -print \
            | sort

      # ---------------------------------------------------------
      # 4. Test Ollama Cloud API key and model
      # ---------------------------------------------------------
      - name: Test Ollama Cloud
        shell: bash
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${OLLAMA_API_KEY:-}" ]; then
            echo "OLLAMA_API_KEY repository secret is missing."
            exit 1
          fi

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --output /tmp/ollama-test-response.json \
              --write-out "%{http_code}" \
              "https://ollama.com/api/chat" \
              -H "Authorization: Bearer $OLLAMA_API_KEY" \
              -H "Content-Type: application/json" \
              --data "{
                \"model\": \"$OLLAMA_MODEL\",
                \"messages\": [
                  {
                    \"role\": \"user\",
                    \"content\": \"Reply only with OK\"
                  }
                ],
                \"stream\": false
              }"
          )"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Ollama Cloud test failed."
            echo "HTTP status: $HTTP_CODE"

            echo
            echo "Response:"
            cat /tmp/ollama-test-response.json || true

            exit 1
          fi

          echo "Ollama Cloud connection succeeded."
          echo "Model: $OLLAMA_MODEL"

      # ---------------------------------------------------------
      # 5. Setup Node.js
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # ---------------------------------------------------------
      # 6. Install OpenCode through npm
      # ---------------------------------------------------------
      - name: Install OpenCode
        shell: bash
        run: |
          set -euo pipefail

          npm install --global opencode-ai@latest

          if ! command -v opencode > /dev/null 2>&1; then
            echo "OpenCode installation failed."
            echo "Global npm binaries:"
            npm bin --global || true
            exit 1
          fi

          echo "OpenCode executable:"
          command -v opencode

          echo
          echo "OpenCode version:"
          opencode --version

      # ---------------------------------------------------------
      # 7. Configure OpenCode for Ollama Cloud
      # ---------------------------------------------------------
      - name: Configure OpenCode for Ollama Cloud
        shell: bash
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail

          CONFIG_DIR="$HOME/.config/opencode"
          CONFIG_FILE="$CONFIG_DIR/opencode.json"

          mkdir -p "$CONFIG_DIR"

          cat > "$CONFIG_FILE" <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "ollama-cloud/gemma4:31b",
            "provider": {
              "ollama-cloud": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "Ollama Cloud",
                "options": {
                  "baseURL": "https://ollama.com/v1",
                  "apiKey": "{env:OLLAMA_API_KEY}"
                },
                "models": {
                  "gemma4:31b": {
                    "name": "Gemma 4 31B",
                    "limit": {
                      "context": 131072,
                      "output": 32768
                    }
                  }
                }
              }
            }
          }
          EOF

          python -m json.tool "$CONFIG_FILE" > /dev/null

          echo "OpenCode configuration created:"
          echo "$CONFIG_FILE"

          echo
          echo "Configured model:"
          echo "ollama-cloud/$OLLAMA_MODEL"

      # ---------------------------------------------------------
      # 8. Run SDS source scan
      # ---------------------------------------------------------
      - name: SDS-RE scan source
        shell: bash
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail

          echo "Running SDS source scan..."
          echo "Component path: $COMPONENT_PATH"
          echo "Output path: $SDS_OUTPUT_PATH"
          echo "Model: ollama-cloud/$OLLAMA_MODEL"

          opencode run \
            "/scan-source --path $COMPONENT_PATH --output $SDS_OUTPUT_PATH" \
            --agent sds-re-lead-agent \
            --model "ollama-cloud/$OLLAMA_MODEL"

          echo
          echo "Files after scan:"
          find "$SDS_OUTPUT_PATH" \
            -type f \
            -print \
            | sort \
            || true

      # ---------------------------------------------------------
      # 9. Generate Reference SDS
      # ---------------------------------------------------------
      - name: Generate Reference SDS
        shell: bash
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail

          echo "Generating Reference SDS..."
          echo "Model: ollama-cloud/$OLLAMA_MODEL"

          opencode run \
            "/generate-re-sds --interactive=false" \
            --agent sds-re-lead-agent \
            --model "ollama-cloud/$OLLAMA_MODEL"

          echo
          echo "Files after SDS generation:"
          find "$SDS_OUTPUT_PATH" \
            -type f \
            -print \
            | sort \
            || true

      # ---------------------------------------------------------
      # 10. Inspect output
      # ---------------------------------------------------------
      - name: Inspect SDS output
        shell: bash
        run: |
          set -euo pipefail

          echo "Generated files under $SDS_OUTPUT_PATH:"

          find "$SDS_OUTPUT_PATH" \
            -type f \
            -print \
            | sort \
            || true

          echo
          echo "Generated file sizes:"

          find "$SDS_OUTPUT_PATH" \
            -type f \
            -exec wc -c {} \; \
            | sort -n \
            || true

      # ---------------------------------------------------------
      # 11. Verify generated SDS
      # ---------------------------------------------------------
      - name: Verify SDS output
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$SDS_OUTPUT_PATH" ]; then
            echo "SDS output directory does not exist:"
            echo "$SDS_OUTPUT_PATH"
            exit 1
          fi

          MARKDOWN_COUNT="$(
            find "$SDS_OUTPUT_PATH" \
              -type f \
              -name '*.md' \
              | wc -l \
              | tr -d ' '
          )"

          if [ "$MARKDOWN_COUNT" -eq 0 ]; then
            echo "No Markdown SDS output was generated."

            echo
            echo "All available output files:"
            find "$SDS_OUTPUT_PATH" \
              -type f \
              -print \
              | sort \
              || true

            echo
            echo "Workspace files matching SDS:"
            find workspace \
              -type f \
              -iname '*sds*.md' \
              -print \
              | sort \
              || true

            exit 1
          fi

          echo "SDS generation completed successfully."
          echo "Markdown file count: $MARKDOWN_COUNT"

          echo
          echo "Generated Markdown files:"

          find "$SDS_OUTPUT_PATH" \
            -type f \
            -name '*.md' \
            -print \
            | sort

      # ---------------------------------------------------------
      # 12. Upload SDS output as artifact
      # ---------------------------------------------------------
      - name: Upload SDS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reference-sds-${{ inputs.component_name }}
          path: workspace/sds-output/**
          if-no-files-found: error
          retention-days: 7
