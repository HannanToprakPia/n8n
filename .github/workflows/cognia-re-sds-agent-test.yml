name: Cognia RE SDS Local Workspace Test

on:
  workflow_dispatch:
    inputs:
      component_name:
        description: Component full name
        required: true
        type: string

      repository_owner:
        description: Component repository owner
        required: true
        default: dnext-technology
        type: string

      repository_name:
        description: Component repository name
        required: true
        type: string

      source_branch:
        description: Component repository branch
        required: true
        default: develop
        type: string

jobs:
  generate-reference-sds:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      OLLAMA_MODEL: gemma4:31b

      COMPONENT_CHECKOUT_PATH: workspace/component-source
      COGNIA_REPO_PATH: workspace/dnext-ai-rnd
      SDS_FRAMEWORK_PATH: workspace/dnext-ai-rnd/Cognia-RE/SDS-RE

      # Bunlar SDS-RE çalışma dizininin altında kalır.
      LOCAL_WORK_ROOT: .runner-work
      LOCAL_COMPONENT_PATH: .runner-work/component-source
      LOCAL_SDS_OUTPUT_PATH: .runner-work/sds-output

    steps:
      # ---------------------------------------------------------
      # 1. Component repository checkout
      # ---------------------------------------------------------
      - name: Checkout component repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository_owner }}/${{ inputs.repository_name }}
          ref: ${{ inputs.source_branch }}
          token: ${{ secrets.COMPONENT_REPO_TOKEN }}
          path: workspace/component-source
          fetch-depth: 1

      # ---------------------------------------------------------
      # 2. Cognia framework repository checkout
      # ---------------------------------------------------------
      - name: Checkout Cognia RE framework repository
        uses: actions/checkout@v4
        with:
          repository: dnext-cognia/dnext-ai-rnd
          ref: develop
          token: ${{ secrets.COGNIA_REPO_TOKEN }}
          path: workspace/dnext-ai-rnd
          fetch-depth: 1

      # ---------------------------------------------------------
      # 3. Verify repositories, agent and commands
      # ---------------------------------------------------------
      - name: Verify repositories and SDS framework
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$COMPONENT_CHECKOUT_PATH/.git" ]; then
            echo "Component repository checkout failed:"
            echo "$COMPONENT_CHECKOUT_PATH"
            exit 1
          fi

          if [ ! -d "$COGNIA_REPO_PATH/.git" ]; then
            echo "Cognia framework checkout failed:"
            echo "$COGNIA_REPO_PATH"
            exit 1
          fi

          REQUIRED_FILES=(
            "$SDS_FRAMEWORK_PATH/.opencode/agents/sds-re-lead-agent.md"
            "$SDS_FRAMEWORK_PATH/.opencode/commands/scan-source.md"
            "$SDS_FRAMEWORK_PATH/.opencode/commands/generate-re-sds.md"
            "$SDS_FRAMEWORK_PATH/.opencode/commands/finalize-re-sds.md"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$file" ]; then
              echo "Required SDS-RE file is missing or empty:"
              echo "$file"
              exit 1
            fi
          done

          echo "Component repository:"
          echo "${{ inputs.repository_owner }}/${{ inputs.repository_name }}"

          echo
          echo "Component commit:"
          git -C "$COMPONENT_CHECKOUT_PATH" rev-parse HEAD

          echo
          echo "Cognia framework commit:"
          git -C "$COGNIA_REPO_PATH" rev-parse HEAD

          echo
          echo "Required agent and command files:"
          printf '%s\n' "${REQUIRED_FILES[@]}"

      # ---------------------------------------------------------
      # 4. Copy component into SDS-RE working directory
      # ---------------------------------------------------------
      - name: Prepare local SDS workspace
        shell: bash
        run: |
          set -euo pipefail

          LOCAL_ROOT="$SDS_FRAMEWORK_PATH/$LOCAL_WORK_ROOT"
          LOCAL_COMPONENT="$SDS_FRAMEWORK_PATH/$LOCAL_COMPONENT_PATH"
          LOCAL_OUTPUT="$SDS_FRAMEWORK_PATH/$LOCAL_SDS_OUTPUT_PATH"

          rm -rf "$LOCAL_ROOT"

          mkdir -p "$LOCAL_COMPONENT"
          mkdir -p "$LOCAL_OUTPUT"

          # Component içeriğini kopyala; .git klasörünü taşıma.
          tar \
            --exclude='.git' \
            -C "$COMPONENT_CHECKOUT_PATH" \
            -cf - . \
            | tar \
                -C "$LOCAL_COMPONENT" \
                -xf -

          echo "SDS-RE working directory:"
          realpath "$SDS_FRAMEWORK_PATH"

          echo
          echo "Local component path:"
          realpath "$LOCAL_COMPONENT"

          echo
          echo "Local output path:"
          realpath "$LOCAL_OUTPUT"

          echo
          echo "Copied component root files:"
          find "$LOCAL_COMPONENT" \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          if [ ! -s "$LOCAL_COMPONENT/pom.xml" ]; then
            echo "Component copy validation failed: pom.xml not found."
            exit 1
          fi

      # ---------------------------------------------------------
      # 5. Test Ollama Cloud
      # ---------------------------------------------------------
      - name: Test Ollama Cloud
        shell: bash
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${OLLAMA_API_KEY:-}" ]; then
            echo "OLLAMA_API_KEY secret is missing."
            exit 1
          fi

          HTTP_CODE="$(
            curl \
              --silent \
              --show-error \
              --output /tmp/ollama-test.json \
              --write-out "%{http_code}" \
              "https://ollama.com/api/chat" \
              -H "Authorization: Bearer $OLLAMA_API_KEY" \
              -H "Content-Type: application/json" \
              --data "{
                \"model\": \"$OLLAMA_MODEL\",
                \"messages\": [
                  {
                    \"role\": \"user\",
                    \"content\": \"Reply only with OK\"
                  }
                ],
                \"stream\": false
              }"
          )"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Ollama Cloud test failed with HTTP $HTTP_CODE."
            cat /tmp/ollama-test.json || true
            exit 1
          fi

          echo "Ollama Cloud connection succeeded."
          echo "Model: $OLLAMA_MODEL"

      # ---------------------------------------------------------
      # 6. Install OpenCode
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode
        shell: bash
        run: |
          set -euo pipefail

          npm install --global opencode-ai@latest

          echo "OpenCode executable:"
          command -v opencode

          echo
          echo "OpenCode version:"
          opencode --version

      # ---------------------------------------------------------
      # 7. Configure OpenCode for Ollama Cloud
      # ---------------------------------------------------------
      - name: Configure OpenCode for Ollama Cloud
        shell: bash
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail

          CONFIG_DIR="$HOME/.config/opencode"
          CONFIG_FILE="$CONFIG_DIR/opencode.json"

          mkdir -p "$CONFIG_DIR"

          cat > "$CONFIG_FILE" <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "ollama-cloud/gemma4:31b",
            "provider": {
              "ollama-cloud": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "Ollama Cloud",
                "options": {
                  "baseURL": "https://ollama.com/v1",
                  "apiKey": "{env:OLLAMA_API_KEY}"
                },
                "models": {
                  "gemma4:31b": {
                    "name": "Gemma 4 31B"
                  }
                }
              }
            }
          }
          EOF

          python -m json.tool "$CONFIG_FILE" > /dev/null

          echo "OpenCode configured for:"
          echo "ollama-cloud/$OLLAMA_MODEL"

      # ---------------------------------------------------------
      # 8. Run actual SDS-RE source scan
      # ---------------------------------------------------------
      - name: Run SDS-RE source scan
        shell: bash
        working-directory: workspace/dnext-ai-rnd/Cognia-RE/SDS-RE
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail

          echo "Current working directory:"
          pwd

          echo
          echo "Component path:"
          realpath "$LOCAL_COMPONENT_PATH"

          echo
          echo "Output path:"
          realpath "$LOCAL_SDS_OUTPUT_PATH"

          opencode run \
            "/scan-source --path $LOCAL_COMPONENT_PATH --output $LOCAL_SDS_OUTPUT_PATH" \
            --agent sds-re-lead-agent \
            --model "ollama-cloud/$OLLAMA_MODEL"

          echo
          echo "Files after source scan:"
          find "$LOCAL_SDS_OUTPUT_PATH" \
            -type f \
            -print \
            | sort \
            || true

      # ---------------------------------------------------------
      # 9. Verify scan created persistent files
      # ---------------------------------------------------------
      - name: Verify SDS source scan
        shell: bash
        working-directory: workspace/dnext-ai-rnd/Cognia-RE/SDS-RE
        run: |
          set -euo pipefail

          FILE_COUNT="$(
            find "$LOCAL_SDS_OUTPUT_PATH" \
              -type f \
              | wc -l \
              | tr -d ' '
          )"

          echo "Source scan output file count: $FILE_COUNT"

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "Source scan did not produce any persistent files."

            echo
            echo "Files created under the local runner workspace:"
            find "$LOCAL_WORK_ROOT" \
              -type f \
              -print \
              | sort \
              || true

            exit 1
          fi

          echo
          echo "Source scan completed successfully."

      # ---------------------------------------------------------
      # 10. Generate SDS
      # ---------------------------------------------------------
      - name: Generate Reference SDS
        shell: bash
        working-directory: workspace/dnext-ai-rnd/Cognia-RE/SDS-RE
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail

          opencode run \
            "/generate-re-sds --interactive=false" \
            --agent sds-re-lead-agent \
            --model "ollama-cloud/$OLLAMA_MODEL"

          echo
          echo "Files after SDS generation:"
          find "$LOCAL_SDS_OUTPUT_PATH" \
            -type f \
            -print \
            | sort \
            || true

      # ---------------------------------------------------------
      # 11. Search for all generated SDS files
      # ---------------------------------------------------------
      - name: Inspect generated SDS files
        shell: bash
        working-directory: workspace/dnext-ai-rnd/Cognia-RE/SDS-RE
        run: |
          set -euo pipefail

          echo "Files in expected output directory:"
          find "$LOCAL_SDS_OUTPUT_PATH" \
            -type f \
            -print \
            | sort \
            || true

          echo
          echo "Markdown files created anywhere under local workspace:"
          find "$LOCAL_WORK_ROOT" \
            -type f \
            -name '*.md' \
            -print \
            | sort \
            || true

          echo
          echo "Potential generated SDS files inside SDS-RE:"
          find . \
            -type f \
            \( \
              -iname 'SDS.md' \
              -o -iname '*reference*sds*.md' \
              -o -path '*/output/*' \
              -o -path '*/progress/*' \
              -o -path '*/drafts/*' \
            \) \
            -print \
            | sort \
            || true

      # ---------------------------------------------------------
      # 12. Verify final Markdown output
      # ---------------------------------------------------------
      - name: Verify SDS output
        shell: bash
        working-directory: workspace/dnext-ai-rnd/Cognia-RE/SDS-RE
        run: |
          set -euo pipefail

          MARKDOWN_COUNT="$(
            find "$LOCAL_SDS_OUTPUT_PATH" \
              -type f \
              -name '*.md' \
              | wc -l \
              | tr -d ' '
          )"

          echo "Markdown files in expected output: $MARKDOWN_COUNT"

          if [ "$MARKDOWN_COUNT" -eq 0 ]; then
            echo "No Markdown SDS output was generated in:"
            echo "$LOCAL_SDS_OUTPUT_PATH"

            echo
            echo "All local workspace files:"
            find "$LOCAL_WORK_ROOT" \
              -type f \
              -print \
              | sort \
              || true

            exit 1
          fi

          echo
          echo "Generated SDS documents:"
          find "$LOCAL_SDS_OUTPUT_PATH" \
            -type f \
            -name '*.md' \
            -print \
            | sort

          echo
          echo "Document sizes:"
          find "$LOCAL_SDS_OUTPUT_PATH" \
            -type f \
            -name '*.md' \
            -exec wc -c {} \; \
            | sort -n

          echo
          echo "SDS generation completed successfully."

      # ---------------------------------------------------------
      # 13. Upload output directly from SDS-RE local workspace
      # ---------------------------------------------------------
      - name: Upload SDS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cognia-reference-sds-${{ inputs.component_name }}
          path: |
            workspace/dnext-ai-rnd/Cognia-RE/SDS-RE/.runner-work/sds-output/**
          if-no-files-found: error
          retention-days: 7
