name: Cognia RE SDS and SRS Generation

on:
  workflow_dispatch:
    inputs:
      component_name:
        description: Component full name
        required: true
        type: string

      repository_owner:
        description: Component repository owner
        required: true
        default: dnext-technology
        type: string

      repository_name:
        description: Component repository name
        required: true
        type: string

      source_branch:
        description: Component repository branch
        required: true
        default: develop
        type: string

jobs:
  generate-reference-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      OLLAMA_MODEL: gemma4:31b

      COMPONENT_CHECKOUT_PATH: workspace/component-source
      COGNIA_REPO_PATH: workspace/dnext-ai-rnd

      SDS_FRAMEWORK_PATH: workspace/dnext-ai-rnd/Cognia-RE/SDS-RE
      SRS_FRAMEWORK_PATH: workspace/dnext-ai-rnd/Cognia-RE/SRS-RE

      SDS_LOCAL_ROOT: .runner-work
      SDS_LOCAL_COMPONENT_PATH: .runner-work/component-source
      SDS_LOCAL_OUTPUT_PATH: .runner-work/sds-output

      SRS_LOCAL_ROOT: .runner-work
      SRS_LOCAL_COMPONENT_PATH: .runner-work/component-source
      SRS_LOCAL_SDS_INPUT_PATH: .runner-work/sds-input
      SRS_LOCAL_OUTPUT_PATH: .runner-work/srs-output

    steps:
      # =========================================================
      # 1. CHECKOUT COMPONENT
      # =========================================================

      - name: Checkout component repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository_owner }}/${{ inputs.repository_name }}
          ref: ${{ inputs.source_branch }}
          token: ${{ secrets.COMPONENT_REPO_TOKEN }}
          path: workspace/component-source
          fetch-depth: 1

      # =========================================================
      # 2. CHECKOUT COGNIA FRAMEWORK
      # =========================================================

      - name: Checkout Cognia RE framework repository
        uses: actions/checkout@v4
        with:
          repository: dnext-cognia/dnext-ai-rnd
          ref: develop
          token: ${{ secrets.COGNIA_REPO_TOKEN }}
          path: workspace/dnext-ai-rnd
          fetch-depth: 1

      # =========================================================
      # 3. VERIFY REPOSITORIES / FRAMEWORK
      # =========================================================

      - name: Verify repositories and frameworks
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$COMPONENT_CHECKOUT_PATH/.git" ]; then
            echo "Component repository checkout failed."
            exit 1
          fi

          if [ ! -d "$COGNIA_REPO_PATH/.git" ]; then
            echo "Cognia repository checkout failed."
            exit 1
          fi

          REQUIRED_FILES=(
            "$SDS_FRAMEWORK_PATH/.opencode/agents/sds-re-lead-agent.md"
            "$SDS_FRAMEWORK_PATH/.opencode/commands/scan-source.md"
            "$SDS_FRAMEWORK_PATH/.opencode/commands/generate-re-sds.md"
            "$SRS_FRAMEWORK_PATH/.opencode/agents/srs-re-lead-agent.md"
            "$SRS_FRAMEWORK_PATH/.opencode/commands/scan-source.md"
            "$SRS_FRAMEWORK_PATH/.opencode/commands/generate-re-srs.md"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -s "$file" ]; then
              echo "Required framework file is missing:"
              echo "$file"
              exit 1
            fi
          done

          echo "Component commit:"
          git -C "$COMPONENT_CHECKOUT_PATH" rev-parse HEAD

          echo "Cognia commit:"
          git -C "$COGNIA_REPO_PATH" rev-parse HEAD

      # =========================================================
      # 4. NODE + OPENCODE
      # =========================================================

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenCode
        shell: bash
        run: |
          set -euo pipefail

          npm install --global opencode-ai@latest

          command -v opencode
          opencode --version

      # =========================================================
      # 5. CONFIGURE OLLAMA CLOUD
      # =========================================================

      - name: Configure OpenCode for Ollama Cloud
        shell: bash
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${OLLAMA_API_KEY:-}" ]; then
            echo "OLLAMA_API_KEY secret is missing."
            exit 1
          fi

          CONFIG_DIR="$HOME/.config/opencode"
          CONFIG_FILE="$CONFIG_DIR/opencode.json"

          mkdir -p "$CONFIG_DIR"

          cat > "$CONFIG_FILE" <<'EOF'
          {
            "$schema": "https://opencode.ai/config.json",
            "model": "ollama-cloud/gemma4:31b",
            "provider": {
              "ollama-cloud": {
                "npm": "@ai-sdk/openai-compatible",
                "name": "Ollama Cloud",
                "options": {
                  "baseURL": "https://ollama.com/v1",
                  "apiKey": "{env:OLLAMA_API_KEY}"
                },
                "models": {
                  "gemma4:31b": {
                    "name": "Gemma 4 31B"
                  }
                }
              }
            }
          }
          EOF

          python -m json.tool "$CONFIG_FILE" > /dev/null

          echo "OpenCode configured with:"
          echo "ollama-cloud/$OLLAMA_MODEL"

      # =========================================================
      # 6. PREPARE SDS WORKSPACE
      # =========================================================

      - name: Prepare SDS local workspace
        shell: bash
        run: |
          set -euo pipefail

          SDS_ROOT="$SDS_FRAMEWORK_PATH/$SDS_LOCAL_ROOT"
          SDS_COMPONENT="$SDS_FRAMEWORK_PATH/$SDS_LOCAL_COMPONENT_PATH"
          SDS_OUTPUT="$SDS_FRAMEWORK_PATH/$SDS_LOCAL_OUTPUT_PATH"

          rm -rf "$SDS_ROOT"

          mkdir -p "$SDS_COMPONENT"
          mkdir -p "$SDS_OUTPUT"

          tar \
            --exclude='.git' \
            -C "$COMPONENT_CHECKOUT_PATH" \
            -cf - . \
            | tar \
                -C "$SDS_COMPONENT" \
                -xf -

          if [ ! -s "$SDS_COMPONENT/pom.xml" ]; then
            echo "Component copy failed."
            exit 1
          fi

          echo "SDS component:"
          realpath "$SDS_COMPONENT"

          echo "SDS output:"
          realpath "$SDS_OUTPUT"

      # =========================================================
      # 7. SDS SOURCE SCAN
      # =========================================================

      - name: Run SDS-RE source scan
        shell: bash
        working-directory: workspace/dnext-ai-rnd/Cognia-RE/SDS-RE
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail

          opencode run \
            "/scan-source --path $SDS_LOCAL_COMPONENT_PATH --output $SDS_LOCAL_OUTPUT_PATH" \
            --agent sds-re-lead-agent \
            --model "ollama-cloud/$OLLAMA_MODEL"

          echo
          echo "Files after SDS scan:"

          find "$SDS_LOCAL_OUTPUT_PATH" \
            -type f \
            -print \
            | sort \
            || true

      # =========================================================
      # 8. GENERATE SDS
      # =========================================================

      - name: Generate Reference SDS
        shell: bash
        working-directory: workspace/dnext-ai-rnd/Cognia-RE/SDS-RE
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail

          opencode run \
            --continue \
            "/generate-re-sds --interactive=false" \
            --agent sds-re-lead-agent \
            --model "ollama-cloud/$OLLAMA_MODEL"

          echo
          echo "Files in SDS output directory:"

          find "$SDS_LOCAL_OUTPUT_PATH" \
            -type f \
            -print \
            | sort \
            || true

          echo
          echo "Possible final SDS files in framework root:"

          find . \
            -maxdepth 1 \
            -type f \
            -iname '*SDS*.md' \
            -print \
            | sort \
            || true

      # =========================================================
      # 9. COLLECT FINAL SDS
      # =========================================================

      - name: Collect final SDS
        shell: bash
        working-directory: workspace/dnext-ai-rnd/Cognia-RE/SDS-RE
        run: |
          set -euo pipefail

          FINAL_SDS=""

          # Önce output dizini içindeki birleşik SDS'leri ara.
          FINAL_SDS="$(
            find "$SDS_LOCAL_OUTPUT_PATH" \
              -maxdepth 1 \
              -type f \
              \( \
                -iname 'FINAL_SDS.md' \
                -o -iname 'SDS.md' \
                -o -iname 'SDS_*Final*.md' \
                -o -iname 'SDS_*.md' \
              \) \
              | head -n 1
          )"

          # Bulunamadıysa framework root'una bak.
          if [ -z "$FINAL_SDS" ]; then
            FINAL_SDS="$(
              find . \
                -maxdepth 1 \
                -type f \
                \( \
                  -iname 'FINAL_SDS.md' \
                  -o -iname 'SDS.md' \
                  -o -iname 'SDS_*Final*.md' \
                  -o -iname 'SDS_*.md' \
                \) \
                | head -n 1
            )"
          fi

          if [ -z "$FINAL_SDS" ]; then
            echo "No consolidated SDS file was found."

            echo
            echo "Available SDS output files:"
            find "$SDS_LOCAL_OUTPUT_PATH" \
              -type f \
              -print \
              | sort \
              || true

            echo
            echo "Markdown files in framework root:"
            find . \
              -maxdepth 1 \
              -type f \
              -name '*.md' \
              -print \
              | sort \
              || true

            exit 1
          fi

          echo "Final SDS found:"
          echo "$FINAL_SDS"

          # Final belge zaten output altında değilse kopyala.
          case "$FINAL_SDS" in
            "$SDS_LOCAL_OUTPUT_PATH"/*)
              echo "Final SDS is already inside SDS output."
              ;;
            *)
              cp "$FINAL_SDS" "$SDS_LOCAL_OUTPUT_PATH/FINAL_SDS.md"
              FINAL_SDS="$SDS_LOCAL_OUTPUT_PATH/FINAL_SDS.md"
              ;;
          esac

          echo
          echo "Normalized final SDS:"
          echo "$FINAL_SDS"

          echo
          echo "Final SDS size:"
          wc -c "$FINAL_SDS"

      # =========================================================
      # 10. VERIFY SDS
      # =========================================================

      - name: Verify SDS output
        shell: bash
        working-directory: workspace/dnext-ai-rnd/Cognia-RE/SDS-RE
        run: |
          set -euo pipefail

          SDS_MARKDOWN_COUNT="$(
            find "$SDS_LOCAL_OUTPUT_PATH" \
              -type f \
              -name '*.md' \
              | wc -l \
              | tr -d ' '
          )"

          echo "SDS Markdown count: $SDS_MARKDOWN_COUNT"

          if [ "$SDS_MARKDOWN_COUNT" -eq 0 ]; then
            echo "No SDS Markdown files generated."
            exit 1
          fi

          echo
          echo "SDS output files:"

          find "$SDS_LOCAL_OUTPUT_PATH" \
            -type f \
            -print \
            | sort

          echo
          echo "SDS generation verified successfully."

      # =========================================================
      # 11. PREPARE SRS WORKSPACE
      # =========================================================

      - name: Prepare SRS local workspace
        shell: bash
        run: |
          set -euo pipefail

          SRS_ROOT="$SRS_FRAMEWORK_PATH/$SRS_LOCAL_ROOT"
          SRS_COMPONENT="$SRS_FRAMEWORK_PATH/$SRS_LOCAL_COMPONENT_PATH"
          SRS_SDS_INPUT="$SRS_FRAMEWORK_PATH/$SRS_LOCAL_SDS_INPUT_PATH"
          SRS_OUTPUT="$SRS_FRAMEWORK_PATH/$SRS_LOCAL_OUTPUT_PATH"

          SDS_OUTPUT="$SDS_FRAMEWORK_PATH/$SDS_LOCAL_OUTPUT_PATH"

          rm -rf "$SRS_ROOT"

          mkdir -p "$SRS_COMPONENT"
          mkdir -p "$SRS_SDS_INPUT"
          mkdir -p "$SRS_OUTPUT"

          tar \
            --exclude='.git' \
            -C "$COMPONENT_CHECKOUT_PATH" \
            -cf - . \
            | tar \
                -C "$SRS_COMPONENT" \
                -xf -

          cp -a "$SDS_OUTPUT/." "$SRS_SDS_INPUT/"

          if [ ! -s "$SRS_COMPONENT/pom.xml" ]; then
            echo "SRS component input copy failed."
            exit 1
          fi

          SDS_INPUT_COUNT="$(
            find "$SRS_SDS_INPUT" \
              -type f \
              -name '*.md' \
              | wc -l \
              | tr -d ' '
          )"

          if [ "$SDS_INPUT_COUNT" -eq 0 ]; then
            echo "No SDS input was copied to SRS."
            exit 1
          fi

          echo "SDS files provided to SRS:"
          find "$SRS_SDS_INPUT" \
            -type f \
            -print \
            | sort

      # =========================================================
      # 12. SRS SOURCE SCAN
      # =========================================================

      - name: Run SRS-RE source scan
        shell: bash
        working-directory: workspace/dnext-ai-rnd/Cognia-RE/SRS-RE
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail

          opencode run \
            "/scan-source --path $SRS_LOCAL_COMPONENT_PATH --sds-output $SRS_LOCAL_SDS_INPUT_PATH --output $SRS_LOCAL_OUTPUT_PATH" \
            --agent srs-re-lead-agent \
            --model "ollama-cloud/$OLLAMA_MODEL"

          echo
          echo "Files after SRS source scan:"

          find "$SRS_LOCAL_OUTPUT_PATH" \
            -type f \
            -print \
            | sort \
            || true

      # =========================================================
      # 13. GENERATE SRS
      # =========================================================

      - name: Generate Reference SRS
        shell: bash
        working-directory: workspace/dnext-ai-rnd/Cognia-RE/SRS-RE
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          set -euo pipefail

          opencode run \
            --continue \
            "/generate-re-srs --interactive=false" \
            --agent srs-re-lead-agent \
            --model "ollama-cloud/$OLLAMA_MODEL"

          echo
          echo "Files in SRS output directory:"

          find "$SRS_LOCAL_OUTPUT_PATH" \
            -type f \
            -print \
            | sort \
            || true

          echo
          echo "Possible final SRS files in framework root:"

          find . \
            -maxdepth 1 \
            -type f \
            -iname '*SRS*.md' \
            -print \
            | sort \
            || true

      # =========================================================
      # 14. COLLECT FINAL SRS
      # =========================================================

      - name: Collect final SRS
        shell: bash
        working-directory: workspace/dnext-ai-rnd/Cognia-RE/SRS-RE
        run: |
          set -euo pipefail

          FINAL_SRS=""

          FINAL_SRS="$(
            find "$SRS_LOCAL_OUTPUT_PATH" \
              -maxdepth 1 \
              -type f \
              \( \
                -iname 'FINAL_SRS.md' \
                -o -iname 'SRS.md' \
                -o -iname 'SRS_*Final*.md' \
                -o -iname 'SRS_*.md' \
              \) \
              | head -n 1
          )"

          if [ -z "$FINAL_SRS" ]; then
            FINAL_SRS="$(
              find . \
                -maxdepth 1 \
                -type f \
                \( \
                  -iname 'FINAL_SRS.md' \
                  -o -iname 'SRS.md' \
                  -o -iname 'SRS_*Final*.md' \
                  -o -iname 'SRS_*.md' \
                \) \
                | head -n 1
            )"
          fi

          if [ -z "$FINAL_SRS" ]; then
            echo "No consolidated SRS file was found."

            echo
            echo "Available SRS files:"
            find "$SRS_LOCAL_OUTPUT_PATH" \
              -type f \
              -print \
              | sort \
              || true

            echo
            echo "Markdown files in SRS framework root:"
            find . \
              -maxdepth 1 \
              -type f \
              -name '*.md' \
              -print \
              | sort \
              || true

            exit 1
          fi

          echo "Final SRS found:"
          echo "$FINAL_SRS"

          case "$FINAL_SRS" in
            "$SRS_LOCAL_OUTPUT_PATH"/*)
              echo "Final SRS is already inside SRS output."
              ;;
            *)
              cp "$FINAL_SRS" "$SRS_LOCAL_OUTPUT_PATH/FINAL_SRS.md"
              FINAL_SRS="$SRS_LOCAL_OUTPUT_PATH/FINAL_SRS.md"
              ;;
          esac

          echo
          echo "Normalized final SRS:"
          echo "$FINAL_SRS"

          wc -c "$FINAL_SRS"

      # =========================================================
      # 15. VERIFY SRS
      # =========================================================

      - name: Verify SRS output
        shell: bash
        working-directory: workspace/dnext-ai-rnd/Cognia-RE/SRS-RE
        run: |
          set -euo pipefail

          SRS_MARKDOWN_COUNT="$(
            find "$SRS_LOCAL_OUTPUT_PATH" \
              -type f \
              -name '*.md' \
              | wc -l \
              | tr -d ' '
          )"

          echo "SRS Markdown count: $SRS_MARKDOWN_COUNT"

          if [ "$SRS_MARKDOWN_COUNT" -eq 0 ]; then
            echo "No SRS Markdown files generated."
            exit 1
          fi

          echo
          echo "Generated SRS files:"

          find "$SRS_LOCAL_OUTPUT_PATH" \
            -type f \
            -print \
            | sort

          echo
          echo "SRS generation verified successfully."

      # =========================================================
      # 16. UPLOAD SDS ARTIFACT
      # =========================================================

      - name: Upload SDS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cognia-reference-sds-${{ inputs.component_name }}
          path: |
            workspace/dnext-ai-rnd/Cognia-RE/SDS-RE/.runner-work/sds-output/**
          if-no-files-found: error
          retention-days: 7

      # =========================================================
      # 17. UPLOAD SRS ARTIFACT
      # =========================================================

      - name: Upload SRS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cognia-reference-srs-${{ inputs.component_name }}
          path: |
            workspace/dnext-ai-rnd/Cognia-RE/SRS-RE/.runner-work/srs-output/**
          if-no-files-found: error
          retention-days: 7
